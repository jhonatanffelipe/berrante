appId: dev.berrante.app
productName: Berrante
copyright: Copyright © 2026 Jhonatan Felipe
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Assinatura ad-hoc ("-"): sem conta de desenvolvedor nem notarização, mas sela o app inteiro.
  # Com identity null o binário fica com a assinatura "linker-signed" do Electron, que quebra ao
  # renomear o app; baixado com quarentena, o macOS diz que ele "está danificado". Veja o guia.
  identity: '-'
  hardenedRuntime: false
  darkModeSupport: true
dmg:
  title: Berrante ${version}
  iconSize: 96
  contents:
    - { x: 140, y: 180 }
    - { x: 400, y: 180, type: link, path: /Applications }
win:
  icon: build/icon.png
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # x64 (Intel/AMD 64 bits) e arm64 (Snapdragon/Windows on ARM). Sem ia32: o Electron não publica mais build
  # Windows 32 bits (electron-v45.x-win32-ia32.zip não existe).
  # Sem certificado de assinatura: o SmartScreen avisa na primeira abertura. Veja o guia de instalação.
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
nsis:
  # Um instalador por arquitetura (o universal juntaria as duas num arquivo só, bem maior).
  buildUniversalInstaller: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Berrante
