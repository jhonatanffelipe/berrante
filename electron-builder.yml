appId: dev.berrante.app
productName: Berrante
copyright: Copyright © 2026 Jhonatan Felipe
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Sem assinatura nem notarização (identity null). Veja o guia para abrir no Gatekeeper.
  identity: null
  hardenedRuntime: false
  darkModeSupport: true
dmg:
  title: Berrante ${version}
  iconSize: 96
  contents:
    - { x: 140, y: 180 }
    - { x: 400, y: 180, type: link, path: /Applications }
# O electron-builder converte build/icon.png (1024px) em .icns (mac) e .ico (app e instalador NSIS).
win:
  icon: build/icon.png
  artifactName: ${productName}-Setup-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64, arm64]
# Instalador "assistente": escolhe só para mim (AppData) ou para todos (Arquivos de Programas),
# a pasta de instalação e cria atalhos; aparece em Configurações → Aplicativos para desinstalar.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Berrante
  uninstallDisplayName: Berrante
  runAfterFinish: true
  deleteAppDataOnUninstall: false
linux:
  icon: build/icon.png
  category: Development
  maintainer: Jhonatan Felipe
  synopsis: Um toque e a boiada vem junto
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  target:
    - target: deb
      arch: [x64, arm64]
    - target: AppImage
      arch: [x64, arm64]
